nt-weight:850}.giant-good{background:var(--ball);color:var(--ink)}.giant-bad{background:var(--brick);color:var(--on-dark)}.mode-secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}.mode-secondary button{min-height:54px}.mode-select{margin:18px 0}.mode-select .exercise-chip{background:transparent;color:var(--on-dark);border-color:var(--muted)}.mode-select .exercise-chip.chosen{background:var(--ball);color:var(--ink);border-color:var(--ball)}.timer{font-size:52px;line-height:1;font-weight:850;color:var(--ball);margin:20px 0}.walk-controls{display:grid;gap:10px}.walk-exercise{display:grid;grid-template-columns:1fr 62px 62px;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--muted)}.walk-exercise button{height:56px;border-radius:16px;font-size:25px;font-weight:850}.walk-exercise .good{background:var(--ball);color:var(--ink)}.walk-exercise .bad{background:var(--brick);color:var(--on-dark)}.walk-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.walk-tools button{min-height:58px}.encounter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.encounter-grid button{min-height:58px}.summary-row{padding:15px 0;border-bottom:1px solid var(--line)}.trend{font-size:12px;font-weight:800}.trend.up{color:var(--grass)}.trend.down{color:var(--brick)}.walk-card{border-left:4px solid var(--ball)}.walk-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 2px var(--grass);margin-right:7px}.place-filter{margin-top:10px}.sync-banner{margin-bottom:16px}.session-summary .field{margin-top:12px}

<body>
<main id="app" class="wrap" aria-live="polite"></main>
<nav id="nav" class="nav" aria-label="Navegación principal"></nav>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<input type="file" id="backup-picker" accept=".json,application/json" class="hide">
<script>
'use strict';
(() => {
  // DogTrainer 1.0: diario local, sin cuentas ni dependencias.
  const KEY = 'dogtrainer_data';
  const UI_PREFS_KEY = 'dogtrainer_ui_prefs';
  const AUTOBACKUP_KEY = 'dogtrainer_autobackup';
  const ACTIVE_SESSION_KEY = 'dogtrainer_active_session';
  const ACTIVE_WALK_KEY = 'dogtrainer_active_walk';
  const APP = 'dogtrainer';
  const SCHEMA = 1;
  const APP_META = {name:'DogTrainer',description:'Diario de entrenamiento, paseos y progreso de tu perro.',version:'1.1.0',author:'Edu López',copyright:'© 2026 Edu López',fileSuffix:'dog'};
  const MARK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2F6B4F"/><circle cx="17" cy="25" r="7" fill="#F2F4EE"/><circle cx="29" cy="16" r="7" fill="#F2F4EE"/><circle cx="43" cy="19" r="8" fill="#D4E157"/><circle cx="49" cy="33" r="7" fill="#F2F4EE"/><path d="M19 48c0-9 6-15 13-15s13 6 13 15c0 6-5 9-13 9s-13-3-13-9Z" fill="#F2F4EE"/><path d="M38 14c4 2 7 6 8 10" fill="none" stroke="#2F6B4F" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  const SESSIONS = ['morning','noon','night'];
  const SINFO = { morning:['☀️','Mañana'], noon:['🌤️','Mediodía'], night:['🌙','Noche'] };
  const RESULTS = { good:['🟢','Muy bien'], mid:['🟡','Regular'], bad:['🔴','Necesita mejorar'] };
  const PLACES = {casa:'Casa',jardin:'Jardín',parque:'Parque',calle:'Calle',otro:'Otro'};
  const ENCOUNTER_TYPES = {perro:'Perro',persona:'Persona',nino:'Niño',bici:'Bici/patinete',vehiculo:'Moto/coche',ruido:'Ruido',otro:'Otro'};
  const REACTIONS = {green:'🟢 Tranquilo',yellow:'🟡 Alerta pero responde',red:'🔴 Reacciona'};
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'dt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
  const localDate = d => [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const today = () => localDate(new Date());
  const localTime = d => [String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0')].join(':');
  const parseDay = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0,0)};
  const shiftDay = (s,n) => {const d=parseDay(s);d.setDate(d.getDate()+n);return localDate(d)};
  const humanDate = (s,opts={weekday:'long',day:'numeric',month:'long'}) => new Intl.DateTimeFormat('es-ES',opts).format(parseDay(s));
  const cap = s => s ? s[0].toUpperCase()+s.slice(1) : '';
  const clone = x => JSON.parse(JSON.stringify(x));
  const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
  const arr = Array.isArray;
  const navInfo = [['today','Hoy','home'],['exercises','Ejercicios','list'],['history','Historial','calendar'],['progress','Progreso','chart'],['settings','Ajustes','settings']];
  const icons = {
    home:'<path d="m3 10 9-7 9 7v 10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
    list:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h9M8 14h9"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',
    chart:'<path d="M4 20V 10m5 10V 5m5 15v-8m5 8V 3"/>',
    settings:'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19 13.5c.1-.5.1-1.5 0-2l2-1.5-2-3.5-2.3.9a8 8 0 0 0-1.7-1L14.6 4h-5.2L9 6.4a8 8 0 0 0-1.7 1L5 6.5 3 10l2 1.5a9 9 0 0 0 0 2L3 15l2 3.5 2.3-.9a8 8 0 0 0 1.7 1l.4 2.4h5.2l.4-2.4a8 8 0 0 0 1.7-1l2.3.9 2-3.5z"/>'
  };
  const svgIcon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
  const app=$('app'), nav=$('nav'), modalRoot=$('modal-root'), toastRoot=$('toast-root');
  let state, broken=null, tab='today', selectedDay=today(), month=today().slice(0,7);
  let filter='30', progressId='', progressPlace='', transientResult='', toastTimer=null, undo=null;
  let pendingImport=null,newExerciseContext=null,previousFocus=null;
  let reportEdited=false,reportLastGenerated='';
  let recordChoice='',modalDirty=false,pendingExternalData=null,wakeLock=null,walkTimer=null;
  let renderIndex={recordsByDate:new Map(),recordsByExercise:new Map(),walksByDate:new Map()};
  let uiPrefs=loadUiPrefs(), waitingServiceWorker=null, globalErrorAt=0;
  let storageInfo={persistent:null,usage:null,quota:null,supported:!!navigator.storage&&location.protocol!=='file:'};

  function loadUiPrefs(){
    try{
      const raw=localStorage.getItem(UI_PREFS_KEY);
      if(raw===null)localStorage.setItem(UI_PREFS_KEY,'{}');
      const value=JSON.parse(raw||'{}');
      return value&&typeof value==='object'&&!arr(value)?value:{};
    }catch(_){return {};}
  }
  function saveUiPrefs(){
    try{localStorage.setItem(UI_PREFS_KEY,JSON.stringify(uiPrefs));}
    catch(err){console.warn('DogTrainer: no se han guardado las preferencias de interfaz',err);}
  }
  const darkMQ=window.matchMedia?.('(prefers-color-scheme: dark)');
  function effectiveTheme(){return uiPrefs.theme==='dark'||(uiPrefs.theme!=='light'&&darkMQ?.matches)?'dark':'light';}
  function applyTheme(){const theme=effectiveTheme();document.documentElement.dataset.theme=theme;$('theme-color-meta')?.setAttribute('content',theme==='dark'?'#101713':'#F2F4EE');}
  const isStandalone=()=>navigator.standalone===true||window.matchMedia?.('(display-mode: standalone)').matches===true;
  const prefActive=name=>Number.isFinite(uiPrefs[name])&&uiPrefs[name]>Date.now();

  // 1. Modelo único y validación estricta.
  function seed(){
    const defs = [
      ['Sentado','Sentarse a petición de forma relajada.'],
      ['Mira','Ofrecer contacto visual voluntario.'],
      ['Luring','Seguir una guía de comida o mano con calma.'],
      ['Posicionamiento base','Trabajar la colocación y orientación corporal.'],
      ['Bozal','Crear una asociación voluntaria y positiva con el bozal.'],
      ['Manipulación','Practicar contacto y revisión corporal de forma tranquila.'],
      ['Paseo sin tirar','Caminar con la correa relajada.'],
      ['Llamada','Volver al escuchar la señal.'],
      ['Déjalo','Apartarse de algo al escuchar la señal.'],
      ['Sentado en cruce','Esperar sentado antes de cruzar.'],
      ['Junto','Caminar cerca y coordinado.']
    ];
    const exercises=defs.map(([name,description])=>({id:uid(),name,description,archived:false}));
    const walkNames=new Set(['Mira','Paseo sin tirar','Llamada','Déjalo','Sentado en cruce','Junto']);
    return {
      appId:APP,schemaVersion:SCHEMA,
      profile:{name:''},settings:{lastExportDate:'',walkExerciseIds:exercises.filter(e=>walkNames.has(e.name)).map(e=>e.id)},
      exercises,records:[],notes:[],rests:[],walks:[]
    };
  }
  function invalid(m){throw new Error(m)}
  const dateOK = s => typeof s==='string' && /^\d{4}-\d\d-\d\d$/.test(s) && localDate(parseDay(s))===s;
  const str = (s,max,required=false) => typeof s==='string' && s.length<=max && (!required||!!s.trim());
  const idOK = s => str(s,110,true) && /^[a-zA-Z0-9_-]+$/.test(s);
  const timeOK = s => typeof s==='string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
  const onlyKeys=(o,allowed)=>o&&Object.keys(o).every(k=>allowed.includes(k));
  function validate(d){
    if(!d||typeof d!=='object'||arr(d)||d.appId!==APP||d.schemaVersion!==SCHEMA||!onlyKeys(d,['appId','schemaVersion','profile','settings','exercises','records','notes','rests','walks']))invalid('La copia no corresponde a DogTrainer 1.0.');
    if(!d.profile||!onlyKeys(d.profile,['name'])||!str(d.profile.name,100))invalid('Perfil inválido.');
    if(!d.settings||!onlyKeys(d.settings,['lastExportDate','walkExerciseIds'])||!str(d.settings.lastExportDate,40)||!arr(d.settings.walkExerciseIds)||new Set(d.settings.walkExerciseIds).size!==d.settings.walkExerciseIds.length)invalid('Ajustes inválidos.');
    if(!arr(d.exercises)||d.exercises.length>1500||!arr(d.records)||d.records.length>100000||
       !arr(d.notes)||d.notes.length>20000||!arr(d.rests)||d.rests.length>30000||!arr(d.walks)||d.walks.length>20000)invalid('Estructura o tamaño de datos inválidos.');
    const exIds=new Set(),walkIds=new Set(),recordIds=new Set(),noteIds=new Set();
    for(const e of d.exercises){
      if(!e||!onlyKeys(e,['id','name','description','archived'])||!idOK(e.id)||exIds.has(e.id)||!str(e.name,140,true)||!str(e.description,2000)||typeof e.archived!=='boolean')invalid('Ejercicio inválido o duplicado.');
      exIds.add(e.id);
    }
    if(d.settings.walkExerciseIds.some(id=>!exIds.has(id)))invalid('Los ejercicios del paseo no existen.');
    for(const w of d.walks){
      if(!w||!onlyKeys(w,['id','date','startTime','endTime','durationMin','route','notes','sniffMin','encounters'])||!idOK(w.id)||walkIds.has(w.id)||!dateOK(w.date)||w.date>today()||!timeOK(w.startTime)||!timeOK(w.endTime)||
         !Number.isInteger(w.durationMin)||w.durationMin<0||w.durationMin>1440||!str(w.route,180)||!str(w.notes,4000)||
         !Number.isInteger(w.sniffMin)||w.sniffMin<0||w.sniffMin>1440||!arr(w.encounters)||w.encounters.length>500)invalid('Paseo inválido.');
      const encounterIds=new Set();
      for(const e of w.encounters){
        if(!e||!onlyKeys(e,['id','time','type','reaction','distance','note'])||!idOK(e.id)||encounterIds.has(e.id)||!timeOK(e.time)||!has(ENCOUNTER_TYPES,e.type)||!has(REACTIONS,e.reaction)||
           !['','2','5','10','20','30+'].includes(e.distance)||!str(e.note,500))invalid('Encuentro de paseo inválido.');
        encounterIds.add(e.id);
      }
      walkIds.add(w.id);
    }
    for(const r of d.records){
      if(!r||!onlyKeys(r,['id','date','time','exerciseId','exerciseName','session','result','observations','attempts','successes','criterion','place','walkId'])||!idOK(r.id)||recordIds.has(r.id)||!dateOK(r.date)||!timeOK(r.time)||
         !idOK(r.exerciseId)||!exIds.has(r.exerciseId)||!str(r.exerciseName,140,true)||
         !SESSIONS.includes(r.session)||!has(RESULTS,r.result)||!str(r.observations,6000))invalid('Registro de entrenamiento inválido.');
      const hasAttempts=has(r,'attempts'),hasSuccesses=has(r,'successes');
      if(hasAttempts!==hasSuccesses||(hasAttempts&&(!Number.isInteger(r.attempts)||r.attempts<1||r.attempts>500||!Number.isInteger(r.successes)||r.successes<0||r.successes>r.attempts)))invalid('Contadores del registro inválidos.');
      if(has(r,'criterion')&&!str(r.criterion,140)||has(r,'place')&&!has(PLACES,r.place)||has(r,'walkId')&&(!idOK(r.walkId)||!walkIds.has(r.walkId)))invalid('Detalles del registro inválidos.');
      recordIds.add(r.id);
    }
    for(const n of d.notes){
      if(!n||!onlyKeys(n,['id','date','time','text'])||!idOK(n.id)||noteIds.has(n.id)||!dateOK(n.date)||n.date>today()||!timeOK(n.time)||!str(n.text,6000,true))invalid('Nota inválida.');
      noteIds.add(n.id);
    }
    if(new Set(d.rests).size!==d.rests.length||d.rests.some(s=>!dateOK(s)))invalid('Días de descanso inválidos.');
    return true;
  }

  // 2. Persistencia transaccional: validar → almacenar → actualizar estado.
  function persist(next){validate(next);localStorage.setItem(KEY,JSON.stringify(next));state=next;}
  function commit(update,success){
    try{
      const next=clone(pendingExternalData||state);update(next);persist(next);pendingExternalData=null;render();
      if(success)toast(success);return true;
    }catch(err){
      console.error('DogTrainer: fallo de guardado',err);
      toast('No se ha guardado: '+(err.name==='QuotaExceededError'?'almacenamiento lleno. Exporta una copia y libera espacio.':err.message),false,true);
      return false;
    }
  }
  function initStore(){
    try{
      const current=localStorage.getItem(KEY);
      if(current!==null){const d=JSON.parse(current),changed=removeRetiredProfileFields(d);validate(d);if(changed)persist(d);else state=d;return;}
      persist(seed());
    }catch(err){
      console.error('DogTrainer: no se han podido cargar los datos',err);
      broken={reason:err.message};
    }
  }
  function removeRetiredProfileFields(data){if(data?.profile&&has(data.profile,'birthDate')){delete data.profile.birthDate;return true;}return false;}
  const findEx=(id,d=state)=>d.exercises.find(e=>e.id===id);
  const findRecord=(id,d=state)=>d.records.find(r=>r.id===id);
  const sessionRecords=(date,session)=>(renderIndex.recordsByDate.get(date)||[]).filter(r=>r.session===session).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const recordsInRange=(exId='')=>{const n=filter==='7'?7:filter==='30'?30:filter==='90'?90:null;const min=n?shiftDay(today(),1-n):null;const source=exId?(renderIndex.recordsByExercise.get(exId)||[]):state.records;return source.filter(r=>(!min||r.date>=min)&&r.date<=today()&&(!progressPlace||r.place===progressPlace));};
  const daysInRange=()=>{const n=filter==='7'?7:filter==='30'?30:filter==='90'?90:null;return n?shiftDay(today(),1-n):null;};
  const formatResult=r=>has(RESULTS,r)?RESULTS[r][0]+' '+RESULTS[r][1]:'';
  function buildRenderIndexes(){
    const recordsByDate=new Map(),recordsByExercise=new Map(),walksByDate=new Map();
    state.records.forEach(r=>{if(!recordsByDate.has(r.date))recordsByDate.set(r.date,[]);recordsByDate.get(r.date).push(r);if(!recordsByExercise.has(r.exerciseId))recordsByExercise.set(r.exerciseId,[]);recordsByExercise.get(r.exerciseId).push(r);});
    state.walks.forEach(w=>{if(!walksByDate.has(w.date))walksByDate.set(w.date,[]);walksByDate.get(w.date).push(w);});
    renderIndex={recordsByDate,recordsByExercise,walksByDate};
  }

  // 4. Componentes reutilizados y rediseñados.

  }
  function showModal(html){

  }
  const modalHeader=title=>`<div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="close" data-act="close" aria-label="Cerrar">×</button></div>`;
  const empty=(msg,symbol='')=>`<div class="empty">${symbol?`<span class="symbol">${symbol}</span>`:''}${esc(msg)}</div>`;
  const avatar=()=>{const initial=(state.profile.name.trim()[0]||'D').toLocaleUpperCase('es');return `<div class="avatar">${esc(initial)}</div>`;};
  const brandMark=()=>`<span class="page-mark" aria-hidden="true">${MARK_SVG}</span>`;
  function parseExportDate(value){
    const match=typeof value==='string'&&/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(value);
    if(!match)return null;
    const [,ys,ms,ds,hs,mins]=match,[y,m,d,h,min]=[ys,ms,ds,hs,mins].map(Number);
    const parsed=new Date(y,m-1,d,h,min,0,0);
    return localDate(parsed)===`${ys}-${ms}-${ds}`&&localTime(parsed)===`${hs}:${mins}`?parsed:null;
  }
  function installCard(){
    if(isStandalone()||prefActive('installDismissedUntil'))return '';
    return `<div class="card install-card"><div class="card-head"><h3>Instala DogTrainer en tu iPhone</h3><button class="quiet" type="button" data-act="dismiss-install" aria-label="Ocultar este aviso">×</button></div><p class="muted small" style="margin-top:9px">En Safari, pulsa Compartir → «Añadir a pantalla de inicio». Abrirla desde allí evita que Safari borre tus datos.</p></div>`;
  }
  function backupReminder(){
    if(!state.records.length||prefActive('backupSnoozedUntil'))return '';

    return `<div class="notice"><strong>Conviene guardar una copia</strong><p style="margin-top:5px">Tienes entrenamientos sin una copia reciente.</p><div class="actions"><button class="primary" type="button" data-act="export">Exportar ahora</button><button class="secondary" type="button" data-act="snooze-backup">Recordar en 3 días</button></div></div>`;
  }
  const formatBytes=value=>{if(!Number.isFinite(value))return 'No disponible';if(value<1024)return `${Math.round(value)} B`;if(value<1048576)return `${(value/1024).toFixed(1)} KB`;return `${(value/1048576).toFixed(1)} MB`;};
  function storageCard(){
    const chars=JSON.stringify(state).length,sizeKB=chars/1024;
    const persistent=storageInfo.persistent===true?'Sí':storageInfo.persistent===false?'No':storageInfo.supported?'Comprobando…':'No disponible';
    const estimate=Number.isFinite(storageInfo.usage)?`${formatBytes(storageInfo.usage)}${Number.isFinite(storageInfo.quota)?` de ${formatBytes(storageInfo.quota)}`:''}`:'No disponible';
    return `<div class="section-bar"><h2>Estado del almacenamiento</h2></div><div class="card"><div class="list-item"><div class="grow"><strong>Almacenamiento persistente</strong><div class="desc">${persistent}</div></div></div><div class="list-item"><div class="grow"><strong>Tamaño de los datos</strong><div class="desc">${sizeKB.toFixed(1)} KB</div></div></div><div class="list-item"><div class="grow"><strong>Uso estimado del sitio</strong><div class="desc">${estimate}</div></div></div>${chars>4*1024*1024?'<div class="notice">Los datos superan 4 MB. Exporta una copia para proteger el historial y revisa si necesitas conservar todos los registros.</div>':''}</div>`;
  }
  function readAutoBackup(){
    try{
      const raw=localStorage.getItem(AUTOBACKUP_KEY);if(raw===null)return null;
      const value=JSON.parse(raw);
      if(!value||typeof value!=='object'||typeof value.savedAt!=='string'||typeof value.reason!=='string'||!value.data)return {invalid:true};
      return value;
    }catch(_){return {invalid:true};}
  }
  function autoBackupCard(){
    const backup=readAutoBackup();if(!backup)return '';

  }
  function lastPracticeDate(exerciseId){

  const dayDistance=(from,to=today())=>Math.max(0,Math.round((parseDay(to)-parseDay(from))/86400000));

  function currentSession(){const hour=new Date().getHours();return hour<12?'morning':hour<17?'noon':'night';}
  function renderHeader(){

    }

  function render(){
    if(broken){renderBroken();return;}

    nav.innerHTML=`<div class="nav-inner">${navInfo.map(([id,name,ic])=>`<button type="button" class="nav-item ${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}" data-act="nav" data-tab="${id}">${svgIcon(ic)}<span>${name}</span></button>`).join('')}</div>`;
    if(focusKey)requestAnimationFrame(()=>{const candidates=[...document.querySelectorAll('[data-act]')].filter(el=>el.dataset.act===focusKey.act);const match=candidates.find(el=>(el.dataset.id||'')===focusKey.id&&(el.dataset.dir||'')===focusKey.dir&&(el.dataset.tab||'')===focusKey.tab);try{match?.focus({preventScroll:true});}catch(_){}});
  }
  function renderBroken(){
    nav.innerHTML='';
    app.innerHTML=`<div class="card" style="margin-top:36px"><h1>⚠️ No se han cargado los datos</h1><p style="margin:15px 0">Los datos locales no se han modificado. Puedes guardar el contenido bruto antes de decidir qué hacer.</p><div class="notice">${esc(broken.reason)}</div><div class="actions"><button class="secondary" data-act="raw-export">Guardar datos actuales</button><button class="primary" data-act="import-pick">Importar copia JSON</button></div><button class="danger-btn full" style="margin-top:14px" data-act="reset-confirm">Reiniciar almacenamiento</button></div>`;
  }

  // 4. Hoy: acceso rápido al diario, la sesión y el paseo.
  function readActive(key){try{const value=JSON.parse(localStorage.getItem(key)||'null');return value&&typeof value==='object'?value:null;}catch(_){return null;}}
  function frequentExercises(session='',limit=3){
    const min=shiftDay(today(),-29),counts=new Map();
    state.records.forEach(r=>{if(r.date<min||r.date>today()||session&&r.session!==session)return;counts.set(r.exerciseId,(counts.get(r.exerciseId)||0)+1);});
    return [...counts.entries()].map(([id,count])=>({exercise:findEx(id),count})).filter(x=>x.exercise&&!x.exercise.archived).sort((a,b)=>b.count-a.count||a.exercise.name.localeCompare(b.exercise.name,'es')).slice(0,limit).map(x=>x.exercise);
  }
  function lastRecord(){return state.records.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0]||null;}
  function renderToday(){
    const day=today();
    const dayNotes=state.notes.filter(n=>n.date===day).sort((a,b)=>b.time.localeCompare(a.time));
    const walks=(renderIndex.walksByDate.get(day)||[]).slice().sort((a,b)=>b.startTime.localeCompare(a.startTime));
    const activeSession=readActive(ACTIVE_SESSION_KEY),activeWalk=readActive(ACTIVE_WALK_KEY),last=lastRecord();
    return `${installCard()}${backupReminder()}
      ${pendingExternalData?'<div class="notice sync-banner">Hay cambios de otra pestaña pendientes. Termina de editar para aplicarlos.</div>':''}
      <div class="today-actions"><button class="primary" data-act="${activeSession?'session-resume':'session-start'}">${activeSession?'▶ Continuar sesión':'▶ Empezar sesión'}</button><button class="secondary" data-act="${activeWalk?'walk-resume':'walk-start'}">${activeWalk?'🦮 Continuar paseo':'🦮 Empezar paseo'}</button></div>
      ${last?`<button class="secondary full" style="margin-bottom:18px" data-act="repeat-last">↻ Repetir último: ${esc(last.exerciseName)}</button>`:''}
      ${state.rests.includes(day)?'<div class="rest-strip">😴 Hoy es un día de descanso. Puedes anotar igualmente lo que quieras.</div>':''}
      <div class="sessions-stack">${SESSIONS.map(s=>renderSession(day,s)).join('')}</div>
      ${walks.length?`<div class="section-bar"><h2>Paseos de hoy</h2></div>${walks.map(renderWalkCard).join('')}`:''}
      <div class="section-bar"><h2>Mis notas</h2><button class="plain-btn" data-act="note-open" data-date="${day}">+ Añadir nota</button></div>
      <div class="card note-card">${dayNotes.length?dayNotes.map(renderNote).join(''):empty('Un espacio para apuntar lo que quieras.','📝')}</div>
      <button class="rest-link" data-act="rest-toggle" data-date="${day}">${state.rests.includes(day)?'↩ Quitar día de descanso':'😴 Marcar hoy como día de descanso'}</button>`;
  }
  function resultPill(r){return `<span class="pill ${r==='good'?'good':r==='mid'?'mid':'bad'}">${esc(RESULTS[r][1])}</span>`;}
  function renderSession(date,s){
    const records=sessionRecords(date,s),future=date>today();

    return `<section class="session diary-session" aria-label="Sesión de ${SINFO[s][1]}">
      <div class="session-heading"><span class="session-emoji" aria-hidden="true">${SINFO[s][0]}</span><div class="grow"><h3>${SINFO[s][1]}</h3><span class="muted small">${records.length?`${records.length} ${records.length===1?'entrenamiento':'entrenamientos'}`:'Sin entrenamientos registrados'}</span></div></div>
      <div class="session-body diary-body">${records.map(r=>`<button type="button" class="diary-entry" data-act="register" data-id="${esc(r.id)}" aria-label="Editar ${esc(r.exerciseName)}: ${esc(RESULTS[r.result][1])}"><span class="entry-marker ${r.result}"></span><span class="grow entry-info"><strong>${esc(r.exerciseName)}</strong>${r.observations?`<span class="entry-note">${esc(r.observations)}</span>`:''}</span>${resultPill(r.result)}<span class="entry-arrow">›</span></button>`).join('')}

      ${future?'<p class="muted small" style="padding:12px 3px">No puedes añadir registros en días futuros.</p>':`<button class="add-exercise" type="button" data-act="register" data-date="${date}" data-session="${s}"><span class="add-icon">＋</span> Añadir ejercicio</button>`}

  function walkSummaryText(w){

  }
  function renderWalkCard(w){return `<div class="card walk-card"><div class="row between"><div class="grow"><h3><span class="walk-dot"></span>${esc(w.route||'Paseo de entrenamiento')}</h3><p class="muted small" style="margin-top:7px">${esc(w.startTime)}–${esc(w.endTime)} · ${esc(walkSummaryText(w))}</p>${w.notes?`<p class="small" style="margin-top:8px">${esc(w.notes)}</p>`:''}</div><button class="tiny-btn" data-act="walk-edit" data-id="${esc(w.id)}">Editar</button></div></div>`;}
  function renderNote(n){return `<div class="note"><p>${esc(n.text)}</p><div class="row between small"><span class="muted">${esc(n.date)}, ${esc(n.time)}</span><button class="plain-btn small" data-act="note-open" data-id="${esc(n.id)}">Editar</button></div></div>`;}

  // 6. Catálogo sencillo.
  function renderExercises(){
    const active=state.exercises.filter(e=>!e.archived),archived=state.exercises.filter(e=>e.archived);

  }
  function exDelete(id){

    const count=(renderIndex.recordsByExercise.get(id)||[]).length;
    confirmSheet('Eliminar ejercicio',`Se eliminará «${e.name}»${count?` y sus ${count} ${count===1?'registro asociado':'registros asociados'}`:''}. Podrás deshacerlo inmediatamente.`, 'ex-delete',`data-id="${esc(id)}"`,'Eliminar ejercicio');
  }
  function cleanActiveExercise(id){

  function deleteExercise(id){
    const e=findEx(id);if(!e)return;const before=clone(e),index=state.exercises.findIndex(x=>x.id===id),records=state.records.filter(r=>r.exerciseId===id).map(clone),wasWalk=state.settings.walkExerciseIds.includes(id);

  // 6. Registro rápido con selección táctil y contadores opcionales.
  const proposedResult=(attempts,successes)=>attempts?successes/attempts>=.8?'good':successes/attempts>=.5?'mid':'bad':'';
  const defaultSessionTime=session=>({morning:'09:00',noon:'14:00',night:'20:00'})[session]||'12:00';
  function orderedExerciseChoices(recordExerciseId=''){
    const choices=state.exercises.filter(e=>!e.archived||e.id===recordExerciseId),popular=frequentExercises('',4),popularIds=new Set(popular.map(e=>e.id));
    return [...popular.filter(e=>choices.some(x=>x.id===e.id)),...choices.filter(e=>!popularIds.has(e.id))];
  }
  function registerModal(date,session,recordId='',preselect='',prefill=null){
    if(!dateOK(date)||!SESSIONS.includes(session))return toast('Fecha o sesión inválidas.');

    if(recordId&&!r)return toast('Este entrenamiento ya no existe.');
    if(date>today()&&!r)return toast('No puedes entrenar en un día futuro.');
    const actualDate=r?.date||date,actualSession=r?.session||session;
    const choices=orderedExerciseChoices(r?.exerciseId||''),popularIds=new Set(frequentExercises('',4).map(e=>e.id));
    recordChoice=r?.exerciseId||preselect||'';
    transientResult=r?.result||'';
    const attempts=r?.attempts||0,successes=r?.successes||0,criterion=r?.criterion??prefill?.criterion??'',place=r?.place??prefill?.place??'';
    const showTime=!!r||actualDate<today(),recordTime=r?.time||(actualDate<today()?defaultSessionTime(actualSession):localTime(new Date()));
    showModal(`${modalHeader(r?'Editar entrenamiento':'Añadir entrenamiento')}
      <div class="context-row"><span class="pill">${SINFO[actualSession][0]} ${SINFO[actualSession][1]}</span><span class="small muted">${esc(humanDate(actualDate,{day:'numeric',month:'long',year:'numeric'}))}</span></div>
      <form id="record-form" data-record="${esc(r?.id||'')}" data-date="${actualDate}" data-session="${actualSession}">
      <input type="hidden" name="exerciseId" value="${esc(recordChoice)}">
      ${choices.length>10?'<label class="field"><span>Buscar ejercicio</span><input id="exercise-search" type="search" autocomplete="off" placeholder="Escribe para filtrar"></label>':''}

  function recordSave(form){
    const id=form.dataset.record,date=form.dataset.date,session=form.dataset.session;
    const exId=form.elements.exerciseId.value,observations=form.elements.observations.value.trim(),time=form.elements.time.value;
    const attempts=Number(form.elements.attempts.value),successes=Number(form.elements.successes.value),criterion=form.elements.criterion.value.trim(),place=form.elements.place.value;
    const ex=findEx(exId),previous=id?findRecord(id):null;
    if(!ex){toast('Selecciona un ejercicio.');return;}
    if(!has(RESULTS,transientResult)){toast('Selecciona cómo ha salido.');return;}
    if(date>today()){toast('No puedes registrar entrenamientos futuros.');return;}
    if(!timeOK(time)){toast('Indica una hora válida.');return;}
    if(!Number.isInteger(attempts)||attempts<0||attempts>500||!Number.isInteger(successes)||successes<0||successes>attempts){toast('Revisa los intentos y aciertos.');return;}
    const before=previous?clone(previous):null,result=transientResult,recordId=id||uid();
    const ok=commit(d=>{
      const unchanged=previous?.exerciseId===exId;
      const item={
        id:recordId,date,time,exerciseId:exId,
        exerciseName:unchanged?previous.exerciseName:ex.name,session,result,observations
      };
      if(attempts){item.attempts=attempts;item.successes=successes;}
      if(criterion)item.criterion=criterion;if(place)item.place=place;if(previous?.walkId)item.walkId=previous.walkId;
      const idx=d.records.findIndex(r=>r.id===recordId);
      if(idx>=0)d.records[idx]=item;else d.records.push(item);
    },previous?'Entrenamiento actualizado.':'Entrenamiento guardado.');
    if(ok){
      closeModal();
      undo=()=>commit(d=>{d.records=d.records.filter(r=>r.id!==recordId);if(before)d.records.push(before);},'Último cambio deshecho.');
      toast(previous?'Entrenamiento actualizado.':'Entrenamiento guardado.',true,false,result==='good');
    }
  }
  function updateRecordCounter(kind,dir){const form=$('record-form');if(!form)return;let attempts=Number(form.elements.attempts.value),successes=Number(form.elements.successes.value);if(kind==='attempts')attempts=Math.max(0,Math.min(500,attempts+dir));else successes=Math.max(0,Math.min(attempts,successes+dir));if(successes>attempts)successes=attempts;form.elements.attempts.value=attempts;form.elements.successes.value=successes;$('attempts-value').textContent=attempts;$('successes-value').textContent=successes;if(attempts){transientResult=proposedResult(attempts,successes);modalRoot.querySelectorAll('.result-btn').forEach(b=>{const chosen=b.dataset.result===transientResult;b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',String(chosen));});}modalDirty=true;}
  function recordDeleteConfirm(id){
    if(!findRecord(id))return;
    confirmSheet('Eliminar entrenamiento','Se eliminará solo esta entrada. Los demás entrenamientos del mismo ejercicio se conservarán. Podrás deshacerlo inmediatamente.','record-delete',`data-id="${esc(id)}"`,'Eliminar');
  }
  function recordDelete(id){
    const r=findRecord(id);if(!r)return;
    const before=clone(r),ok=commit(d=>{d.records=d.records.filter(x=>x.id!==id);},'Entrenamiento eliminado.');
    if(ok){closeModal();undo=()=>commit(d=>{d.records.push(before);},'Entrenamiento recuperado.');toast('Entrenamiento eliminado.',true);}
  }

  // 7. Sesión en vivo: cada repetición se guarda fuera del diario hasta terminar.
  function writeActive(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch(err){toast('No se puede guardar la actividad en curso: '+(quotaExceeded(err)?'almacenamiento lleno.':err.message),false,true);return false;}}
  function removeActive(key){try{localStorage.removeItem(key);}catch(_){}}
  async function requestWakeLock(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(_){}}
  function releaseWakeLock(){try{wakeLock?.release?.();}catch(_){}wakeLock=null;}
  function showFullScreen(html){previousFocus=document.activeElement;modalDirty=false;modalRoot.innerHTML=`<section class="full-screen" role="dialog" aria-modal="true"><div class="full-screen-inner">${html}</div></section>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>modalRoot.querySelector('button')?.focus({preventScroll:true}));}
  function startSession(){
    if(readActive(ACTIVE_WALK_KEY))return toast('Termina primero el paseo en curso.');
    const choices=state.exercises.filter(e=>!e.archived);if(!choices.length)return toast('Crea un ejercicio antes de empezar.');
    const first=frequentExercises('',1)[0]||choices[0],now=new Date();
    const live={startedAt:now.toISOString(),date:today(),time:localTime(now),session:currentSession(),currentExerciseId:first.id,items:{},history:[]};
    if(writeActive(ACTIVE_SESSION_KEY,live)){renderLiveSession();requestWakeLock();}
  }
  function sessionItem(live,id){if(!live.items[id])live.items[id]={attempts:0,successes:0,criterion:''};return live.items[id];}
  function renderLiveSession(){
    const live=readActive(ACTIVE_SESSION_KEY);if(!live)return startSession();
    const choices=state.exercises.filter(e=>!e.archived),current=choices.find(e=>e.id===live.currentExerciseId)||choices[0];if(!current){removeActive(ACTIVE_SESSION_KEY);return closeModal();}
    live.currentExerciseId=current.id;const item=sessionItem(live,current.id),pct=item.attempts?Math.round(item.successes/item.attempts*100):0;
    writeActive(ACTIVE_SESSION_KEY,live);
    showFullScreen(`<div class="mode-head"><strong>Sesión en curso</strong><button class="quiet" data-act="session-finish">Terminar</button></div><p class="mode-title">Ejercicio actual</p><h1 class="mode-exercise">${esc(current.name)}</h1><div class="live-score">${pct}%</div><p class="live-meta">${item.successes} aciertos de ${item.attempts} intentos</p><div class="giant-actions"><button class="giant-good" data-act="session-count" data-value="1" aria-label="Registrar acierto">✓</button><button class="giant-bad" data-act="session-count" data-value="0" aria-label="Registrar fallo">✗</button></div><button class="secondary full" data-act="session-undo" ${live.history.length?'':'disabled'}>↶ Deshacer última repetición</button><div class="mode-select"><p class="mode-title">Cambiar de ejercicio</p><div class="chip-grid">${choices.map(e=>`<button class="exercise-chip ${e.id===current.id?'chosen':''}" data-act="session-switch" data-id="${esc(e.id)}">${esc(e.name)}</button>`).join('')}</div></div></div>`);
  }
  function countSession(success){const live=readActive(ACTIVE_SESSION_KEY);if(!live)return;const item=sessionItem(live,live.currentExerciseId);if(item.attempts>=500)return toast('Has alcanzado 500 intentos para este ejercicio.');item.attempts++;if(success)item.successes++;live.history.push({exerciseId:live.currentExerciseId,success:!!success});writeActive(ACTIVE_SESSION_KEY,live);renderLiveSession();}
  function undoSession(){const live=readActive(ACTIVE_SESSION_KEY),last=live?.history?.pop();if(!last)return;const item=sessionItem(live,last.exerciseId);item.attempts--;if(last.success)item.successes--;writeActive(ACTIVE_SESSION_KEY,live);renderLiveSession();}
  function sessionFinishSummary(){
    const live=readActive(ACTIVE_SESSION_KEY);if(!live)return;
    const items=Object.entries(live.items).filter(([,x])=>x.attempts>0);if(!items.length)return confirmSheet('Terminar sesión','No hay repeticiones registradas. Puedes descartar esta sesión vacía.','session-discard','','Descartar sesión');
    releaseWakeLock();
    showModal(`${modalHeader('Resumen de la sesión')}<form id="finish-session-form">${items.map(([id,item])=>{const e=findEx(id),pct=Math.round(item.successes/item.attempts*100),result=proposedResult(item.attempts,item.successes),tip=item.attempts>=5?(pct>=80?'Puedes subir el criterio':pct<50?'Prueba a bajar el criterio':''):'';return `<div class="summary-row session-summary" data-id="${esc(id)}"><h3>${esc(e?.name||'Ejercicio')}</h3><p class="muted small">${item.successes}/${item.attempts} aciertos · ${pct}%</p>${tip?`<div class="hint-box">${tip}</div>`:''}<label class="field"><span>Criterio</span><input name="criterion-${esc(id)}" maxlength="140" value="${esc(item.criterion||'')}"></label><label class="field"><span>Resultado</span><select name="result-${esc(id)}">${Object.entries(RESULTS).map(([key,value])=>`<option value="${key}" ${key===result?'selected':''}>${value[0]} ${value[1]}</option>`).join('')}</select></label></div>`;}).join('')}<button class="primary full" type="submit">Guardar sesión</button></form>`);
  }
  function saveFinishedSession(form){
    const live=readActive(ACTIVE_SESSION_KEY);if(!live)return toast('La sesión ya no está disponible.',false,true);
    const entries=Object.entries(live.items).filter(([,x])=>x.attempts>0),created=[];
    const ok=commit(d=>{for(const [id,item] of entries){const e=findEx(id,d);if(!e)invalid('Uno de los ejercicios ya no existe.');const result=form.elements[`result-${id}`].value,criterion=form.elements[`criterion-${id}`].value.trim();if(!has(RESULTS,result))invalid('Resultado de sesión inválido.');const record={id:uid(),date:live.date,time:live.time,exerciseId:id,exerciseName:e.name,session:live.session,result,observations:'',attempts:item.attempts,successes:item.successes};if(criterion)record.criterion=criterion;d.records.push(record);created.push(record.id);}},'Sesión guardada.');

  }
  function discardSession(){removeActive(ACTIVE_SESSION_KEY);releaseWakeLock();closeModal();render();toast('Sesión descartada.');}

  // 8. Paseo de entrenamiento con controles grandes y sin ubicación.
  function walkStartModal(){
    if(readActive(ACTIVE_SESSION_KEY))return toast('Termina primero la sesión en curso.');
    showModal(`${modalHeader('Empezar paseo')}<form id="walk-start-form"><label class="field"><span>Lugar o ruta (opcional)</span><input name="route" maxlength="180" placeholder="Ej. vuelta por el parque"></label><label class="field"><span>Entorno</span><select name="place">${Object.entries(PLACES).map(([id,label])=>`<option value="${id}" ${id==='calle'?'selected':''}>${label}</option>`).join('')}</select></label><button class="primary full" type="submit">🦮 Empezar paseo</button></form><p class="muted small" style="margin-top:12px">No se usa el GPS.</p>`);
  }
  function beginWalk(form){
    const now=new Date(),ids=state.settings.walkExerciseIds.filter(id=>findEx(id)&&!findEx(id).archived),counters={};ids.forEach(id=>counters[id]={attempts:0,successes:0});
    const live={startedAt:now.toISOString(),date:today(),startTime:localTime(now),route:form.elements.route.value.trim(),place:form.elements.place.value||'calle',counters,encounters:[],sniffMin:0,notes:[]};

  }
  function walkElapsedSeconds(live){return Math.min(86400,Math.max(0,Math.floor((Date.now()-new Date(live.startedAt).getTime())/1000)));}
  function walkDurationMin(live){return Math.max(1,Math.ceil(walkElapsedSeconds(live)/60));}
  function formatElapsed(seconds){const hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),secs=seconds%60;return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;}
  function startWalkTicker(){clearInterval(walkTimer);walkTimer=setInterval(()=>{const live=readActive(ACTIVE_WALK_KEY),clock=$('walk-clock');if(!live||!clock){clearInterval(walkTimer);return;}clock.textContent=formatElapsed(walkElapsedSeconds(live));},1000);}

    const live=readActive(ACTIVE_WALK_KEY);if(!live)return walkStartModal();
    const entries=Object.entries(live.counters).map(([id,count])=>({exercise:findEx(id),count})).filter(x=>x.exercise&&!x.exercise.archived),lastEncounter=live.encounters[live.encounters.length-1];

  }
  function countWalk(id,success){const live=readActive(ACTIVE_WALK_KEY),counter=live?.counters?.[id];if(!counter)return;if(counter.attempts>=500)return toast('Has alcanzado 500 intentos.');counter.attempts++;if(success)counter.successes++;writeActive(ACTIVE_WALK_KEY,live);renderLiveWalk();}
  function encounterTypeModal(){const live=readActive(ACTIVE_WALK_KEY);if(!live)return;showModal(`${modalHeader('¿Qué habéis encontrado?')}<div class="encounter-grid">${Object.entries(ENCOUNTER_TYPES).map(([id,label])=>`<button class="secondary" data-act="encounter-type" data-type="${id}">${esc(label)}</button>`).join('')}</div>`);}

  function encounterDetailModal(id){const live=readActive(ACTIVE_WALK_KEY),item=live?.encounters?.find(e=>e.id===id);if(!item)return;showModal(`${modalHeader('Detalle del encuentro')}<form id="encounter-detail-form" data-id="${esc(id)}"><label class="field"><span>Distancia aproximada</span><select name="distance"><option value="">Sin indicar</option>${['2','5','10','20','30+'].map(x=>`<option value="${x}" ${item.distance===x?'selected':''}>${x} m</option>`).join('')}</select></label><label class="field"><span>Nota (opcional)</span><textarea name="note" maxlength="500" rows="3">${esc(item.note)}</textarea></label><button class="primary full" type="submit">Guardar detalle</button></form>`);}

  function walkFinishSummary(){

  function saveFinishedWalk(){
    const live=readActive(ACTIVE_WALK_KEY);if(!live)return;const now=new Date(),walkId=uid(),duration=walkDurationMin(live),created=[];
    const ok=commit(d=>{const walk={id:walkId,date:live.date,startTime:live.startTime,endTime:localTime(now),durationMin:duration,route:live.route,notes:live.notes.join('\n'),sniffMin:live.sniffMin,encounters:clone(live.encounters)};d.walks.push(walk);for(const [id,c] of Object.entries(live.counters)){if(!c.attempts)continue;const e=findEx(id,d);if(!e)invalid('Uno de los ejercicios del paseo ya no existe.');const record={id:uid(),date:live.date,time:live.startTime,exerciseId:id,exerciseName:e.name,session:live.startTime<'12:00'?'morning':live.startTime<'17:00'?'noon':'night',result:proposedResult(c.attempts,c.successes),observations:'',attempts:c.attempts,successes:c.successes,place:live.place||'calle',walkId};d.records.push(record);created.push(record.id);}},'Paseo guardado.');

  function reportBounds(kind='last7',customStart='',customEnd=''){

    if(!dateOK(customStart)||!dateOK(customEnd))return {error:'Elige una fecha de inicio y una fecha de fin.'};
    if(customStart>customEnd)return {error:'La fecha de inicio no puede ser posterior a la fecha de fin.'};

  }

  function downloadText(text,filename,type='application/json;charset=utf-8'){
    const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);

  async function shareOrDownload(text,filename){

      try{await navigator.share({files:[file],title:'Copia de DogTrainer'});return true;}
      catch(err){if(err?.name==='AbortError')return false;throw err;}

    downloadText(text,filename);return true;
  }

  async function importFile(file){
    if(!file)return;

    try{
      const data=JSON.parse(await file.text());
      if(!data||data.appId!==APP||data.schemaVersion!==SCHEMA)invalid('Solo se aceptan copias de DogTrainer 1.0.');
      let restored;
      if(data.data&&typeof data.exportedAt==='string'){restored=clone(data.data);removeRetiredProfileFields(restored);validate(restored);}
      else{restored=clone(data);removeRetiredProfileFields(restored);validate(restored);}

      ctx.fillStyle='#2F6B4F';ctx.fillRect(0,0,size,size);
      const image=new Image();
      image.onload=()=>{ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(image,padding,padding,size-padding*2,size-padding*2);resolve(canvas.toDataURL('image/png'));};
      image.onerror=()=>reject(new Error('No se pudo crear el icono'));
      image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MARK_SVG);
    });
  }
  async function setupInstallAssets(){
    try{
      const [icon32,icon180,icon192,icon512,maskable512]=await Promise.all([markPng(32),markPng(180),markPng(192),markPng(512),markPng(512,51)]);
      const favicon=document.createElement('link');favicon.rel='icon';favicon.type='image/png';favicon.sizes='32x32';favicon.href=icon32;document.head.appendChild(favicon);
      const apple=document.createElement('link');apple.rel='apple-touch-icon';apple.sizes='180x180';apple.href=icon180;document.head.appendChild(apple);
      const scope=new URL('./',location.href).href,start=new URL('index.html',scope).href;
      const dark=effectiveTheme()==='dark',theme=dark?'#101713':'#F2F4EE';
      const manifest={name:'DogTrainer',short_name:'DogTrainer',display:'standalone',start_url:start,scope,theme_color:theme,background_color:theme,icons:[{src:icon192,sizes:'192x192',type:'image/png',purpose:'any'},{src:icon512,sizes:'512x512',type:'image/png',purpose:'any'},{src:maskable512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
      const manifestUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
      const link=document.createElement('link');link.rel='manifest';link.href=manifestUrl;document.head.appendChild(link);
    }catch(_){}
  }
  async function setupStoragePersistence(){
    if(!navigator.storage||location.protocol==='file:')return;
    try{
      if(typeof navigator.storage.persisted==='function')storageInfo.persistent=await navigator.storage.persisted();
      if(storageInfo.persistent===false&&typeof navigator.storage.persist==='function'){
        let requested=false;
        try{requested=sessionStorage.getItem('dogtrainer_persist_requested')==='1';if(!requested)sessionStorage.setItem('dogtrainer_persist_requested','1');}catch(_){}
        if(!requested)storageInfo.persistent=await navigator.storage.persist();
      }
      if(typeof navigator.storage.estimate==='function'){
        const estimate=await navigator.storage.estimate();storageInfo.usage=estimate.usage;storageInfo.quota=estimate.quota;
      }
    }catch(err){console.warn('DogTrainer: no se ha podido consultar el almacenamiento',err);}
    if(tab==='settings'&&state&&!broken)render();
  }
  function offerServiceWorkerUpdate(worker){
    waitingServiceWorker=worker;
    toast('Hay una versión nueva',{label:'Actualizar',act:'sw-update'});
  }
  async function registerServiceWorker(){
    if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
    try{
      const registration=await navigator.serviceWorker.register('./sw.js');
      if(registration.waiting&&navigator.serviceWorker.controller)offerServiceWorkerUpdate(registration.waiting);
      registration.addEventListener('updatefound',()=>{
        const worker=registration.installing;if(!worker)return;
        worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)offerServiceWorkerUpdate(worker);});
      });
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        let pending=false;try{pending=sessionStorage.getItem('dogtrainer_sw_reload_once')==='pending';}catch(_){}
        if(!pending)return;
        try{sessionStorage.setItem('dogtrainer_sw_reload_once','done');}catch(_){}
        location.reload();
      });
      try{if(sessionStorage.getItem('dogtrainer_sw_reload_once')==='done')sessionStorage.removeItem('dogtrainer_sw_reload_once');}catch(_){}
    }catch(err){console.warn('DogTrainer: no se ha podido activar el modo sin conexión',err);}
  }
  function reportGlobalError(detail){
    console.error('DogTrainer: error global',detail);
    const now=Date.now();if(now-globalErrorAt<10000)return;globalErrorAt=now;
    toast('Algo ha fallado. Tus datos no se han modificado.',false,true);
  }
  window.addEventListener('error',ev=>reportGlobalError(ev.error||ev.message));
  window.addEventListener('unhandledrejection',ev=>reportGlobalError(ev.reason));
  window.addEventListener('storage',ev=>{
    if(ev.key!==KEY)return;
    try{
      const raw=localStorage.getItem(KEY);if(raw===null)invalid('Los datos se han eliminado en otra ventana.');
      const next=JSON.parse(raw);validate(next);
      if(modalRoot.innerHTML&&modalDirty){pendingExternalData=next;toast('Hay cambios de otra pestaña. Se aplicarán cuando termines de editar.');return;}
      if(modalRoot.innerHTML)closeModal();
      state=next;broken=null;render();toast('Datos actualizados desde otra ventana');
    }catch(err){console.error('DogTrainer: datos externos rechazados',err);toast('No se han aplicado los datos de otra ventana porque no son válidos.',false,true);}
  });
  function updateThemeColor(){if((uiPrefs.theme||'auto')==='auto')applyTheme();}
  function offerInterruptedActivity(){
    if(readActive(ACTIVE_WALK_KEY)){showModal(`${modalHeader('Paseo sin terminar')}<p style="margin-bottom:18px">El paseo sigue guardado con todo lo registrado.</p><div class="actions"><button class="secondary" data-act="walk-finish">Terminar con lo registrado</button><button class="primary" data-act="walk-resume">Continuar paseo</button></div>`);return;}
    if(readActive(ACTIVE_SESSION_KEY))showModal(`${modalHeader('Sesión sin terminar')}<p style="margin-bottom:18px">La sesión sigue guardada con todas sus repeticiones.</p><div class="actions"><button class="danger-btn" data-act="session-discard">Descartar</button><button class="primary" data-act="session-resume">Continuar sesión</button></div>`);
  }
  applyTheme();setupInstallAssets();initStore();render();darkMQ?.addEventListener?.('change',updateThemeColor);setupStoragePersistence();registerServiceWorker();if(!broken)offerInterruptedActivity();
})();
</script>
</body>
